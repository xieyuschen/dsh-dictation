name: Check candidate release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install isolated browser and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Isolated browser tests with simulated ASR
        run: npm run test:browser
      - name: Build classic DSH client
        run: npm run build
      - name: Check repository and package for potential leaks
        run: node scripts/check-public.mjs
      - name: Inspect package payload without lifecycle scripts
        run: npm pack --dry-run --json --ignore-scripts
      - name: Audit development dependencies
        run: npm audit --audit-level=high
