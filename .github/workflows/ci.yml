name: Check candidate release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install isolated browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install operating-system dependencies for browser
        run: npx playwright install-deps chromium
      - name: Unit tests
        run: npm test
      - name: Isolated browser tests with simulated ASR
        env:
          PLAYWRIGHT_DISABLE_SANDBOX: '1'
        run: npm run test:browser
      - name: Build classic DSH client
        run: npm run build
      - name: Check repository and package for potential leaks
        run: node scripts/check-public.mjs
      - name: Inspect package payload without lifecycle scripts
        run: npm pack --dry-run --json --ignore-scripts
      - name: Audit development dependencies
        run: npm audit --audit-level=high
